name: Lightmapping
options:
  bundleIdPrefix: com.jondoesflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lightmapping:
    type: application
    platform: iOS
    sources:
      - Lightmapping
    info:
      path: Lightmapping/Info.plist
      properties:
        CFBundleDisplayName: Lightmapping
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Use the camera as live projection content and for hand and face tracking.
        NSMicrophoneUsageDescription: Let visuals react to sound in the room.
        NSPhotoLibraryUsageDescription: Import photos and videos to project.
        NSPhotoLibraryAddUsageDescription: Save exported shows to your Photos library.
        NSLocalNetworkUsageDescription: Send exported shows to a nearby receiver device.
        NSBonjourServices:
          - _lm-link._tcp
          - _lm-link._udp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondoesflow.lightmapping
        TARGETED_DEVICE_FAMILY: "1,2"
        MTL_FAST_MATH: YES
  LightmappingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LightmappingTests
    dependencies:
      - target: Lightmapping
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lightmapping:
    build:
      targets:
        Lightmapping: all
    test:
      targets:
        - LightmappingTests
